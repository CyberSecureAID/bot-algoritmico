  <style>
  /* ══════════════════════════════════════════════════════════════
     LAS FLECHITAS DE LA BARRA DE DESPLAZAMIENTO
     Van AQUÍ, en el HTML, y no en un archivo CSS, por un motivo: cada
     módulo (market, academy, perfil…) inyecta sus propios estilos al
     cargarse, y esos se ponen DESPUÉS del archivo, así que lo pisan.
     Un estilo en el <head> del documento con !important gana siempre.
     ══════════════════════════════════════════════════════════════ */
  ::-webkit-scrollbar-button,
  ::-webkit-scrollbar-button:start,
  ::-webkit-scrollbar-button:end,
  ::-webkit-scrollbar-button:start:decrement,
  ::-webkit-scrollbar-button:end:increment,
  ::-webkit-scrollbar-button:vertical:start:decrement,
  ::-webkit-scrollbar-button:vertical:end:increment,
  ::-webkit-scrollbar-button:vertical:start:increment,
  ::-webkit-scrollbar-button:vertical:end:decrement,
  ::-webkit-scrollbar-button:horizontal:start:decrement,
  ::-webkit-scrollbar-button:horizontal:end:increment,
  *::-webkit-scrollbar-button {
    display: none !important;
    width: 0 !important;
    height: 0 !important;
    background: none !important;
    background-image: none !important;
  }
  ::-webkit-scrollbar { width: 7px !important; height: 7px !important; }
  ::-webkit-scrollbar-track { background: transparent !important; }
  ::-webkit-scrollbar-thumb {
    background: rgba(232, 184, 75, .3) !important;
    border-radius: 20px !important;
    border: none !important;
  }
  ::-webkit-scrollbar-thumb:hover { background: rgba(232, 184, 75, .5) !important; }
  ::-webkit-scrollbar-corner { background: transparent !important; }
  html { scrollbar-width: thin; scrollbar-color: rgba(232,184,75,.3) transparent; }

  /* ══════════════════════════════════════════════════════════════
     LAS FLECHITAS DE LOS CAMPOS NUMÉRICOS EN EL MÓVIL
     Los campos ya se crean como texto, pero esto es la red de
     seguridad: si algún módulo crea uno nuevo con type=number, aquí
     se le quitan igual. Va en el <head> para que nada lo pise.
     ══════════════════════════════════════════════════════════════ */
  @media (max-width: 760px) {
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button,
    input::-webkit-inner-spin-button,
    input::-webkit-outer-spin-button {
      -webkit-appearance: none !important;
      appearance: none !important;
      margin: 0 !important;
      display: none !important;
      width: 0 !important;
      height: 0 !important;
      opacity: 0 !important;
    }
    input[type="number"] { -moz-appearance: textfield !important; }
  }
  </style>
  <!-- App instalable: icono propio, pantalla completa y arranque sin conexión -->

    /* Negro del bot desde el primer instante. Antes heredaba el verde de la

<body>
  <div id="colmena-app"></div>
  <script src="assets/js/news.js?v=10"></script>
  <script type="module" src="assets/js/gridbot-ui.js?v=125"></script>
  <script>
  /* Protección contra "clickjacking": si alguien mete CriptoCuba dentro de un
     marco en su propia web, podría poner botones falsos encima para que
     firmes algo sin darte cuenta. Si detectamos que no somos la ventana
     principal, salimos del marco. No afecta al uso normal. */
  (function () {
    try {
      if (window.top !== window.self) {
        document.documentElement.style.display = 'none';
        window.top.location = window.self.location.href;
      }
    } catch (_) {
      // Si ni siquiera podemos mirar la ventana de arriba, es que nos tienen
      // encerrados en un marco de otro dominio: tapamos la página.
      document.documentElement.style.display = 'none';
      document.addEventListener('DOMContentLoaded', () => {
        document.body.innerHTML = '<div style="font-family:system-ui;color:#eaecef;background:#0b0e11;padding:40px;text-align:center;min-height:100vh"><h2 style="color:#E8B84B">Abre CriptoCuba directamente</h2><p style="color:#8b96a3">Esta página no debe usarse dentro de otro sitio, por tu seguridad.<br><a style="color:#E8B84B" href="https://cybersecureaid.github.io/bot-algoritmico/" target="_top">Ir a CriptoCuba</a></p></div>';
        document.documentElement.style.display = '';
      });
    }
  })();
  </script>
  <script>
  /* App instalable. El service worker solo guarda la app (pantalla y código);
     los datos de la blockchain siempre se piden frescos. */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
  </script>
  <script>
  /* Red de seguridad: si en 20 s la app no arrancó (CDN caído, red lenta), avisamos
     en vez de dejar un "Cargando…" eterno. */
  (function () {
    setTimeout(function () {
      var app = document.getElementById('colmena-app');
      if (!app || app.dataset.ok === '1') return;
      if (app.querySelector('.c-hdr')) return;           // ya cargó
      app.innerHTML = '<div id="aurex-fallback" style="min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px;text-align:center;font-family:system-ui,sans-serif">'
        + '<div style="font-size:42px">\u26A0\uFE0F</div>'
        + '<div style="font-family:\'Chakra Petch\',sans-serif;font-weight:800;font-size:20px;color:#E8B84B">No se pudo cargar la app</div>'
        + '<div style="font-size:14px;color:#b7bdc6;line-height:1.6;max-width:420px">Suele ser un problema temporal de red o de los servidores externos que usamos. Tus fondos est\u00e1n seguros: viven en la blockchain, no aqu\u00ed.</div>'
        + '<button onclick="location.reload()" style="margin-top:6px;padding:13px 26px;border-radius:12px;border:1px solid #c79426;background:linear-gradient(180deg,#f7db8d,#E8B84B 45%,#c79426);color:#3a2800;font-family:\'Chakra Petch\',sans-serif;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 4px 0 #8f6a1a">Reintentar</button>'
        + '</div>';
    }, 20000);
  })();
  </script>
  <!-- Asistente de la web. Funciona por reglas, sin depender de ninguna IA
       externa: responde al instante, no cuesta nada y sigue funcionando
       aunque la conexión vaya mal. Todo lo que sabe está en conocimiento.js -->
  <!-- El botón del asistente se dibuja AQUÍ, en el HTML, para que esté desde
       el primer instante. Antes solo aparecía cuando cargaba el módulo, y
       quien echaba un vistazo rápido a la página ni sabía que existía.
       Pesa cero: es un botón y un poco de CSS. Al tocarlo carga el asistente
       de verdad y se abre. -->
  <style>
    #np-fab-previo{position:fixed;right:20px;bottom:20px;z-index:200;display:grid;place-items:center;
      width:58px;height:58px;padding:0;border-radius:50%;cursor:pointer;border:1px solid #c79426;
      background:linear-gradient(180deg,rgba(255,255,255,.3),transparent 55%),linear-gradient(180deg,#f7db8d,#E8B84B 45%,#c79426);
      box-shadow:0 6px 20px rgba(0,0,0,.5),0 0 0 0 rgba(232,184,75,.5);color:#3a2800;
      animation:npLat 3.4s ease-in-out 1.5s infinite}
    #np-fab-previo svg{width:24px;height:24px}
    #np-fab-previo:active{transform:translateY(2px)}
    @keyframes npLat{0%,100%{box-shadow:0 6px 20px rgba(0,0,0,.5),0 0 0 0 rgba(232,184,75,.45)}
      50%{box-shadow:0 6px 20px rgba(0,0,0,.5),0 0 0 12px rgba(232,184,75,0)}}
    @media(max-width:760px){#np-fab-previo{width:46px;height:46px;right:12px;bottom:12px;display:none!important}
      #np-fab-previo svg{width:20px;height:20px}}
    @media(prefers-reduced-motion:reduce){#np-fab-previo{animation:none}}
  </style>
  <button id="np-fab-previo" aria-label="Abrir el asistente" type="button">
    <!-- EXACTAMENTE el mismo icono que el asistente real: si cambia al
         cargar, se nota el parpadeo y queda mal hecho. -->
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
      <path d="M20 2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4v3.2a.8.8 0 0 0 1.3.62L13.5 18H20a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
      <circle cx="8" cy="10" r="1.15" fill="currentColor"/>
      <circle cx="12" cy="10" r="1.15" fill="currentColor"/>
      <circle cx="16" cy="10" r="1.15" fill="currentColor"/>
    </svg>
  </button>

  <script>
  /* El asistente pesa unos 210 KB y nadie lo necesita en el primer segundo.
     Se carga cuando la página ya está usable, o antes si el visitante toca
     algo (por si quiere ayuda ya). Con conexiones lentas, esto es la
     diferencia entre entrar en 5 segundos o en 14. */
  (function () {
    var puesto = false;
    function cargarAsistente() {
      if (puesto) return; puesto = true;
      // Si ya cargó por su cuenta, el botón provisional sobra.
      var espera = setInterval(function () {
        if (!document.getElementById('npFab')) return;
        clearInterval(espera);
        var pv = document.getElementById('np-fab-previo');
        if (pv) pv.remove();
      }, 150);
      setTimeout(function () { clearInterval(espera); }, 15000);
      ['assets/js/asistente/conocimiento.js?v=125',
       'assets/js/asistente/motor.js?v=125'].forEach(function (src, i) {
        var t = document.createElement('script');
        t.src = src;
        if (i === 0) t.onload = function () {
          var m = document.createElement('script');
          m.src = 'assets/js/asistente/motor.js?v=125';
          document.body.appendChild(m);
        };
        if (i === 0) document.body.appendChild(t);
      });
    }
    // El botón provisional: al tocarlo carga el asistente y lo abre.
    var previo = document.getElementById('np-fab-previo');
    if (previo) previo.addEventListener('click', function () {
      previo.style.opacity = '.5';
      cargarAsistente();
      // Cuando el asistente de verdad esté listo, quitamos el provisional
      // y abrimos el chat: para el usuario es un solo gesto.
      var t = setInterval(function () {
        var real = document.getElementById('npFab');
        if (!real) return;
        clearInterval(t);
        previo.remove();
        real.click();
      }, 120);
      setTimeout(function () { clearInterval(t); previo.style.opacity = ''; }, 12000);
    });

    ['pointerdown', 'keydown', 'touchstart'].forEach(function (ev) {
      window.addEventListener(ev, cargarAsistente, { once: true, passive: true });
    });
    window.addEventListener('load', function () { setTimeout(cargarAsistente, 2000); });
  })();
  </script>
