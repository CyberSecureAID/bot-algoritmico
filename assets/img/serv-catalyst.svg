<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1016"/><stop offset="1" stop-color="#05070a"/>
    </linearGradient>
    <linearGradient id="cgold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7db8d"/><stop offset="55%" stop-color="#E8B84B"/><stop offset="1" stop-color="#c79426"/>
    </linearGradient>
    <radialGradient id="cglow" cx="50%" cy="38%" r="60%">
      <stop offset="0" stop-color="#E8B84B" stop-opacity=".16"/><stop offset="1" stop-color="#E8B84B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#cg)"/>
  <rect width="400" height="300" fill="url(#cglow)"/>
  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity=".035" stroke-width="1">
    <line x1="0" y1="90" x2="400" y2="90"/><line x1="0" y1="150" x2="400" y2="150"/><line x1="0" y1="210" x2="400" y2="210"/>
  </g>
  <!-- bollinger-ish band -->
  <path d="M30 120 C 110 70, 200 150, 280 110 S 380 160, 380 150" fill="none" stroke="#7896c8" stroke-opacity=".5" stroke-width="2"/>
  <path d="M30 185 C 110 150, 200 210, 280 175 S 380 215, 380 205" fill="none" stroke="#7896c8" stroke-opacity=".5" stroke-width="2"/>
  <!-- moving average -->
  <path d="M30 160 C 120 120, 210 180, 300 140 380 118 380 118" fill="none" stroke="url(#cgold)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- candles -->
  <g>
    <g transform="translate(70,0)"><line x1="0" y1="118" x2="0" y2="182" stroke="#2ee86a" stroke-width="2"/><rect x="-6" y="132" width="12" height="36" rx="2" fill="#2ee86a"/></g>
    <g transform="translate(120,0)"><line x1="0" y1="140" x2="0" y2="205" stroke="#ff5b6e" stroke-width="2"/><rect x="-6" y="150" width="12" height="42" rx="2" fill="#ff5b6e"/></g>
    <g transform="translate(170,0)"><line x1="0" y1="108" x2="0" y2="170" stroke="#2ee86a" stroke-width="2"/><rect x="-6" y="120" width="12" height="38" rx="2" fill="#2ee86a"/></g>
    <g transform="translate(230,0)"><line x1="0" y1="96" x2="0" y2="158" stroke="#2ee86a" stroke-width="2"/><rect x="-6" y="104" width="12" height="44" rx="2" fill="#2ee86a"/></g>
    <g transform="translate(290,0)"><line x1="0" y1="120" x2="0" y2="182" stroke="#ff5b6e" stroke-width="2"/><rect x="-6" y="128" width="12" height="40" rx="2" fill="#ff5b6e"/></g>
  </g>
  <!-- trigger spark -->
  <circle cx="230" cy="100" r="7" fill="url(#cgold)"/>
  <circle cx="230" cy="100" r="13" fill="none" stroke="#E8B84B" stroke-opacity=".5" stroke-width="2"/>
  <text x="28" y="48" font-family="'Chakra Petch',system-ui,sans-serif" font-size="30" font-weight="700" fill="#eef1f4">Catalyst</text>
  <text x="29" y="70" font-family="'IBM Plex Mono',monospace" font-size="11" letter-spacing="3" fill="#E8B84B">SIX SETUPS · ONE TRIGGER</text>
</svg>
