<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Futures · Cripto Cuba Oficial</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="icon" type="image/png" href="assets/img/cco-32.png">
  <style>
    :root{
      --gold:#E8B84B;--gold-soft:#C9A84B;--gold-lo:#8f6a1a;
      --up:#22c55e;--up-d:#16a34a;--down:#f6465d;--down-d:#e11d48;
      --ink:#eef1f6;--ink2:#a9b2bd;--ink3:#7d8794;--ink4:#4a5561;
      --line:#1e2530;--line2:#2b3340;
      --panel:rgba(16,20,26,.72);--panel-solid:#0e1218;
      --mono:'IBM Plex Mono',monospace;--disp:'Plus Jakarta Sans',sans-serif;
    }
    html,body{margin:0;padding:0;background:#04060a;height:100%;overflow:hidden;font-family:var(--disp);color:var(--ink)}
    *{box-sizing:border-box}
    ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#232b36;border-radius:4px}

    /* ── Fondo propio (futuros-bg.webp), bien encajado, sin cortes ── */
    #f-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background:#04060a}
    #f-bg.img{
      background-image:linear-gradient(180deg,rgba(6,8,13,.82),rgba(4,6,10,.9)),url('assets/portada/img/futuros-bg.webp');
      background-size:cover;background-position:center center;background-repeat:no-repeat;background-attachment:fixed;
    }

    /* ── Rejilla del exchange ── */
    #f-app{position:relative;z-index:1;height:100vh;display:grid;
      grid-template-rows:54px 1fr 176px;grid-template-columns:1fr 300px}

    /* Barra de contrato. */
    #f-top{grid-column:1/3;display:flex;align-items:center;gap:0;padding:0 8px 0 14px;
      background:linear-gradient(180deg,rgba(14,18,24,.95),rgba(10,13,18,.92));
      border-bottom:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
    .f-back{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;margin-right:12px;
      color:var(--ink2);text-decoration:none;font-size:17px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
    .f-back:hover{color:var(--gold);border-color:var(--gold-soft)}

    /* Selector de moneda con estilo. */
    .f-coin{position:relative}
    .f-coin__btn{display:flex;align-items:center;gap:9px;background:transparent;border:none;cursor:pointer;padding:6px 8px;border-radius:10px}
    .f-coin__btn:hover{background:rgba(255,255,255,.04)}
    .f-coin__ico{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#1b2230,#0d1119);
      border:1px solid var(--line2);display:grid;place-items:center;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--gold)}
    .f-coin__nm{font-family:var(--disp);font-weight:800;font-size:17px;color:var(--ink);letter-spacing:.2px}
    .f-coin__nm em{font-style:normal;color:var(--ink3);font-weight:600;font-size:13px}
    .f-coin__cv{color:var(--ink3);font-size:11px;transition:transform .15s}
    .f-coin.open .f-coin__cv{transform:rotate(180deg)}
    .f-coin__menu{position:absolute;top:46px;left:0;width:260px;max-height:60vh;overflow-y:auto;z-index:30;
      background:var(--panel-solid);border:1px solid var(--line2);border-radius:14px;padding:6px;
      box-shadow:0 24px 60px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.04);display:none}
    .f-coin.open .f-coin__menu{display:block}
    .f-coin__search{width:100%;background:rgba(10,14,19,.8);border:1px solid var(--line2);border-radius:9px;
      color:var(--ink);font-family:var(--mono);font-size:12px;padding:8px 10px;margin-bottom:5px;outline:none}
    .f-coin__opt{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:9px;cursor:pointer}
    .f-coin__opt:hover{background:rgba(232,184,75,.08)}
    .f-coin__opt b{font-family:var(--disp);font-weight:700;font-size:13.5px;color:var(--ink)}
    .f-coin__opt span{font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-left:auto}

    /* Datos del contrato (precio, cambio). */
    .f-data{display:flex;align-items:center;gap:20px;margin-left:20px}
    .f-data .d{display:flex;flex-direction:column;line-height:1.25}
    .f-data .d b{font-family:var(--mono);font-size:14px;color:var(--ink)}
    .f-data .d.px b{font-size:16px}
    .f-data .d span{font-family:var(--mono);font-size:9px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em}
    .f-data .up{color:var(--up)!important} .f-data .down{color:var(--down)!important}

    /* Temporalidades — a la IZQUIERDA, sobre la gráfica (no sobre el panel). */
    #f-tf{display:flex;gap:3px;margin-left:24px}
    #f-tf button{background:transparent;color:var(--ink3);border:none;border-radius:7px;
      padding:6px 9px;font-family:var(--mono);font-size:11.5px;font-weight:700;cursor:pointer}
    #f-tf button:hover{color:var(--ink)} #f-tf button.on{color:var(--gold);background:rgba(232,184,75,.12)}

    /* Gráfica. */
    #f-chart{grid-row:2;grid-column:1;position:relative;border-right:1px solid var(--line)}
    #f-chart .fg-cv{display:block;width:100%;height:100%;cursor:crosshair}
    #f-chart .fg-load{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:var(--mono);font-size:12px;color:var(--ink3)}

    /* ── Panel de orden (estilo Binance, con nuestro estilo) ── */
    #f-panel{grid-row:2;grid-column:2;background:var(--panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
      overflow-y:auto;padding:13px 12px 18px;display:flex;flex-direction:column;gap:11px}

    /* Margin mode + leverage (arriba, como Binance). */
    .p-top{display:flex;gap:7px}
    .p-top .chip{flex:1;height:32px;border-radius:9px;border:1px solid var(--line2);background:rgba(10,14,19,.55);
      color:var(--ink2);font-family:var(--mono);font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
    .p-top .chip:hover{border-color:var(--gold-soft);color:var(--ink)}
    .p-top .chip b{color:var(--gold);font-family:var(--disp)}

    /* Tabs Market / Limit. */
    .p-tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:2px}
    .p-tabs button{flex:1;background:none;border:none;color:var(--ink3);font-family:var(--disp);font-weight:700;
      font-size:13px;padding:9px 0;cursor:pointer;position:relative}
    .p-tabs button.on{color:var(--ink)}
    .p-tabs button.on::after{content:"";position:absolute;left:20%;right:20%;bottom:-1px;height:2px;background:var(--gold);border-radius:2px}

    .p-avbl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px}
    .p-avbl span{color:var(--ink3)} .p-avbl b{color:var(--ink)}

    .p-field .p-lbl{font-family:var(--mono);font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
    .p-box{display:flex;align-items:center;background:rgba(10,14,19,.55);border:1px solid var(--line2);border-radius:10px;padding:0 12px;height:44px}
    .p-box:focus-within{border-color:var(--gold-soft)}
    .p-box input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--ink);font-family:var(--disp);font-weight:700;font-size:18px}
    .p-box input::placeholder{color:var(--ink4)} .p-box .u{font-family:var(--disp);font-weight:700;font-size:12px;color:var(--ink2);white-space:nowrap}

    /* Slider de % del margen. */
    .p-pcts{display:flex;gap:6px;margin-top:8px}
    .p-pcts button{flex:1;height:26px;border-radius:7px;border:1px solid var(--line2);background:rgba(10,14,19,.5);
      color:var(--ink3);font-family:var(--mono);font-size:10.5px;font-weight:700;cursor:pointer}
    .p-pcts button:hover{border-color:var(--gold-soft);color:var(--ink)}

    /* Apalancamiento. */
    .p-lev-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
    .p-lev-top .p-lbl{margin:0}
    .p-lev-val{font-family:var(--disp);font-weight:800;font-size:16px;color:var(--gold)}
    input[type=range]{width:100%;height:4px;-webkit-appearance:none;appearance:none;background:linear-gradient(90deg,var(--gold),var(--gold-lo));border-radius:4px;cursor:pointer;outline:none}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
      background:linear-gradient(180deg,#f7db8d,var(--gold) 55%,#c79426);border:1px solid #c79426;box-shadow:0 2px 5px rgba(0,0,0,.5)}
    input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--gold);border:1px solid #c79426}
    .p-lev-marks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;color:var(--ink4);margin-top:3px}

    /* Info de la orden. */
    .p-info{display:flex;flex-direction:column;gap:5px;padding:10px 12px;background:rgba(10,14,19,.4);
      border:1px solid var(--line);border-radius:11px}
    .p-info .r{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px}
    .p-info .r span{color:var(--ink3)} .p-info .r b{color:var(--ink)} .p-info .r b.liq{color:var(--down)}

    /* Botones Long / Short (bisel 3D, nuestro estilo). */
    .p-btns{display:flex;flex-direction:column;gap:8px}
    .p-btn{height:46px;border-radius:12px;border:none;font-family:var(--disp);font-weight:800;font-size:15px;cursor:pointer;
      transition:filter .14s,transform .08s,box-shadow .08s;position:relative}
    .p-btn.long{color:#052e13;background:linear-gradient(180deg,#3ee089,var(--up) 46%,var(--up-d));
      border:1px solid #15803d;box-shadow:0 4px 0 #0f5c30,inset 0 1px 0 rgba(255,255,255,.35)}
    .p-btn.short{color:#fff;background:linear-gradient(180deg,#fb5c6f,var(--down) 46%,var(--down-d));
      border:1px solid #be123c;box-shadow:0 4px 0 #8f0f2e,inset 0 1px 0 rgba(255,255,255,.22)}
    .p-btn:hover{filter:brightness(1.06)} .p-btn:active{transform:translateY(3px)}
    .p-btn.long:active{box-shadow:0 1px 0 #0f5c30,inset 0 1px 0 rgba(255,255,255,.35)}
    .p-btn.short:active{box-shadow:0 1px 0 #8f0f2e,inset 0 1px 0 rgba(255,255,255,.22)}
    .p-btn small{display:block;font-weight:600;font-size:10px;opacity:.85;margin-top:1px}

    .p-hint{font-family:var(--mono);font-size:9px;line-height:1.5;color:var(--ink4);text-align:center;padding:0 4px}

    /* ── Posiciones (abajo) ── */
    #f-pos{grid-column:1/3;grid-row:3;background:rgba(9,12,17,.9);border-top:1px solid var(--line);
      backdrop-filter:blur(12px);overflow-y:auto}
    .fp-tabs{display:flex;gap:20px;padding:11px 18px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(9,12,17,.96)}
    .fp-tabs button{background:none;border:none;color:var(--ink3);font-family:var(--disp);font-weight:700;font-size:12.5px;
      padding:0 0 10px;cursor:pointer;position:relative}
    .fp-tabs button.on{color:var(--ink)}
    .fp-tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--gold);border-radius:2px}
    .fp-tabs button .badge{font-family:var(--mono);font-size:10px;color:var(--ink4);margin-left:5px}
    #f-pos-list{padding:6px 18px 14px}
    .pos-empty{font-family:var(--mono);font-size:12px;color:var(--ink4);text-align:center;padding:26px}
    .pos-head,.pos-row{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr 1fr 80px;gap:12px;align-items:center;
      font-family:var(--mono);font-size:11.5px;padding:9px 0}
    .pos-head{color:var(--ink4);font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line)}
    .pos-row{border-bottom:1px solid rgba(255,255,255,.03);color:var(--ink)}
    .pos-row .side{font-weight:800} .pos-row .side.long{color:var(--up)} .pos-row .side.short{color:var(--down)}
    .pos-row .close{background:rgba(246,70,93,.1);border:1px solid rgba(246,70,93,.3);color:var(--down);border-radius:8px;
      padding:6px 0;cursor:pointer;font-family:var(--disp);font-weight:700;font-size:11px}
    .pos-row .close:hover{background:rgba(246,70,93,.2)}

    @media(max-width:1120px){#f-app{grid-template-columns:1fr 270px}}
  </style>
</head>
<body>
  <script>
  (function(){try{
    var m=window.matchMedia?window.matchMedia('(max-width:900px)').matches
         :(document.documentElement.clientWidth||0)<=900;
    if(m)location.replace('app.html');
  }catch(_){}})();
  </script>

  <div id="f-bg" aria-hidden="true"></div>
  <div id="f-app">

    <!-- Barra de contrato -->
    <div id="f-top">
      <a class="f-back" href="index.html" title="Volver">←</a>

      <div class="f-coin" id="f-coin">
        <button class="f-coin__btn" id="f-coin-btn">
          <span class="f-coin__ico" id="f-coin-ico">BTC</span>
          <span class="f-coin__nm" id="f-coin-nm">BTC<em>/USDT</em></span>
          <span class="f-coin__cv">▼</span>
        </button>
        <div class="f-coin__menu" id="f-coin-menu">
          <input class="f-coin__search" id="f-coin-search" placeholder="Buscar moneda…" autocomplete="off">
          <div id="f-coin-opts"></div>
        </div>
      </div>

      <div class="f-data">
        <div class="d px"><b id="f-price">—</b><span>Precio</span></div>
        <div class="d"><b id="f-chg">—</b><span>Cambio 24h</span></div>
        <div class="d"><b id="f-fund">0.010%</b><span>Financiación</span></div>
      </div>

      <div id="f-tf">
        <button data-tf="5m">5m</button>
        <button data-tf="15m" class="on">15m</button>
        <button data-tf="1h">1h</button>
        <button data-tf="4h">4h</button>
        <button data-tf="1d">1D</button>
      </div>
    </div>

    <!-- Gráfica -->
    <div id="f-chart"></div>

    <!-- Panel de orden -->
    <div id="f-panel">
      <div class="p-top">
        <button class="chip" id="p-mode">Aislado</button>
        <button class="chip" id="p-levchip">Apalanc. <b id="p-levchip-v">10×</b></button>
      </div>

      <div class="p-tabs">
        <button class="on" data-ord="market">Market</button>
        <button data-ord="limit">Limit</button>
      </div>

      <div class="p-avbl"><span>Disponible</span><b>— USDT</b></div>

      <div class="p-field" id="p-price-field" style="display:none">
        <div class="p-lbl">Precio</div>
        <div class="p-box"><input id="p-price-in" type="text" inputmode="decimal" placeholder="0.00"><span class="u">USDT</span></div>
      </div>

      <div class="p-field">
        <div class="p-lbl">Margen</div>
        <div class="p-box"><input id="p-margen" type="text" inputmode="decimal" placeholder="0.00"><span class="u">USDT</span></div>
        <div class="p-pcts">
          <button data-pct="25">25%</button><button data-pct="50">50%</button>
          <button data-pct="75">75%</button><button data-pct="100">100%</button>
        </div>
      </div>

      <div class="p-field">
        <div class="p-lev-top"><span class="p-lbl">Apalancamiento</span><span class="p-lev-val" id="p-lev">10×</span></div>
        <input type="range" id="p-range" min="1" max="100" value="10" step="1">
        <div class="p-lev-marks"><span>1×</span><span>25×</span><span>50×</span><span>75×</span><span>100×</span></div>
      </div>

      <div class="p-info">
        <div class="r"><span>Tamaño de posición</span><b id="p-size">—</b></div>
        <div class="r"><span>Precio de liquidación</span><b class="liq" id="p-liq">—</b></div>
      </div>

      <div class="p-btns">
        <button class="p-btn long" id="p-long">Long / Comprar<small>Ganas si el precio sube</small></button>
        <button class="p-btn short" id="p-short">Short / Vender<small>Ganas si el precio baja</small></button>
      </div>

      <div class="p-hint">También puedes hacer clic derecho en la gráfica para entrar en un precio exacto.</div>
    </div>

    <!-- Posiciones -->
    <div id="f-pos">
      <div class="fp-tabs">
        <button class="on" data-tab="pos">Posiciones <span class="badge" id="f-pos-n">(0)</span></button>
        <button data-tab="ord">Órdenes</button>
      </div>
      <div id="f-pos-list"><div class="pos-empty">No tienes posiciones abiertas.</div></div>
    </div>
  </div>

  <script type="module">
    import { crearGrafica } from './assets/js/futuros-grafica.js?v=1';
    import { conectarFuturos, pintarPosiciones, posiciones, abrirDesdePanel, cerrarPosicion } from './assets/js/futuros-orden.js?v=2';
    import { arrancarIdioma } from './assets/js/idioma.js?v=147';

    const PARES = [
      ['BTCUSDT','BTC','Bitcoin'],['ETHUSDT','ETH','Ethereum'],['BNBUSDT','BNB','BNB'],['SOLUSDT','SOL','Solana'],
      ['XRPUSDT','XRP','XRP'],['DOGEUSDT','DOGE','Dogecoin'],['ADAUSDT','ADA','Cardano'],['AVAXUSDT','AVAX','Avalanche'],
      ['LINKUSDT','LINK','Chainlink'],['DOTUSDT','DOT','Polkadot'],['NEARUSDT','NEAR','Near'],['LTCUSDT','LTC','Litecoin'],
      ['ATOMUSDT','ATOM','Cosmos'],['UNIUSDT','UNI','Uniswap'],['INJUSDT','INJ','Injective'],['APTUSDT','APT','Aptos'],
      ['ARBUSDT','ARB','Arbitrum'],['OPUSDT','OP','Optimism'],['FILUSDT','FIL','Filecoin'],['SUIUSDT','SUI','Sui'],
      ['TIAUSDT','TIA','Celestia'],['SEIUSDT','SEI','Sei'],['PEPEUSDT','PEPE','Pepe'],['WIFUSDT','WIF','dogwifhat']
    ];
    const $ = (id) => document.getElementById(id);

    // Fondo propio: se aplica si la imagen existe.
    (function(){ var b=$('f-bg'); var img=new Image();
      img.onload=function(){ b.classList.add('img'); }; img.src='assets/portada/img/futuros-bg.webp'; })();

    // Estado.
    let sim='BTCUSDT', tf='15m', lado='long', lev=10, ordTipo='market';
    let precio=0, chg=0;

    const g = crearGrafica($('f-chart'));
    g.cargar(sim, tf);
    conectarFuturos(g.cfg);
    g.alDibujar((api) => pintarPosiciones(api));

    const fmt=(p)=> !p?'—':(p>=1000?p.toLocaleString('en-US',{maximumFractionDigits:1}):p>=1?p.toFixed(2):p.toPrecision(4));
    function liqDe(e,l,esL){const f=0.75;return esL?e*(1-f/l):e*(1+f/l);}

    // Selector de moneda con estilo.
    const coin=$('f-coin'), opts=$('f-coin-opts');
    function pintarOpts(filtro){
      const f=(filtro||'').toUpperCase();
      opts.innerHTML=PARES.filter(p=>!f||p[1].includes(f)||p[2].toUpperCase().includes(f))
        .map(p=>`<div class="f-coin__opt" data-sim="${p[0]}"><b>${p[1]}/USDT</b><span>${p[2]}</span></div>`).join('');
      opts.querySelectorAll('.f-coin__opt').forEach(o=>o.onclick=()=>{ elegir(o.dataset.sim); coin.classList.remove('open'); });
    }
    function elegir(s){
      sim=s; const p=PARES.find(x=>x[0]===s);
      $('f-coin-ico').textContent=p[1]; $('f-coin-nm').innerHTML=p[1]+'<em>/USDT</em>';
      g.cargar(sim, tf);
    }
    $('f-coin-btn').onclick=(e)=>{ e.stopPropagation(); coin.classList.toggle('open'); if(coin.classList.contains('open')){ pintarOpts(''); $('f-coin-search').value=''; $('f-coin-search').focus(); } };
    $('f-coin-search').oninput=(e)=>pintarOpts(e.target.value);
    $('f-coin-search').onclick=(e)=>e.stopPropagation();
    document.addEventListener('click',()=>coin.classList.remove('open'));

    // Temporalidades.
    document.querySelectorAll('#f-tf button').forEach(b=>b.onclick=()=>{
      document.querySelectorAll('#f-tf button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); tf=b.dataset.tf; g.setTemporalidad(tf);
    });

    // Tabs Market / Limit.
    document.querySelectorAll('.p-tabs button').forEach(b=>b.onclick=()=>{
      document.querySelectorAll('.p-tabs button').forEach(x=>x.classList.remove('on')); b.classList.add('on');
      ordTipo=b.dataset.ord; $('p-price-field').style.display = ordTipo==='limit'?'':'none';
    });

    // Long / Short.
    $('p-long').onclick=()=>ejecutar('long');
    $('p-short').onclick=()=>ejecutar('short');
    function ejecutar(l){
      const margen=parseFloat(($('p-margen').value||'').replace(/,/g,''))||0;
      if(!margen){ $('p-margen').focus(); return; }
      abrirDesdePanel({lado:l,margen,lev});
      const btn=l==='long'?$('p-long'):$('p-short');
      const html=btn.innerHTML; btn.textContent='Muy pronto — en desarrollo';
      setTimeout(()=>{btn.innerHTML=html;},1500); pintarLista();
    }

    // Apalancamiento.
    $('p-range').oninput=(e)=>{ lev=+e.target.value; $('p-lev').textContent=lev+'×'; $('p-levchip-v').textContent=lev+'×'; refrescar(); };

    // % del margen (placeholder: sin saldo real todavía).
    document.querySelectorAll('.p-pcts button').forEach(b=>b.onclick=()=>{ /* con contrato: % del saldo */ });

    $('p-margen').oninput=refrescar;
    function refrescar(){
      precio=g.cfg.precioActual()||precio;
      const margen=parseFloat(($('p-margen').value||'').replace(/,/g,''))||0;
      $('p-size').textContent=margen?fmt(margen*lev)+' USDT':'—';
      $('p-liq').textContent=(precio&&margen)?'$'+fmt(liqDe(precio,lev,lado==='long')):'—';
    }

    // Lista de posiciones.
    function pintarLista(){
      const ps=posiciones(); $('f-pos-n').textContent='('+ps.length+')';
      const c=$('f-pos-list');
      if(!ps.length){ c.innerHTML='<div class="pos-empty">No tienes posiciones abiertas.</div>'; return; }
      c.innerHTML='<div class="pos-head"><span>Símbolo / Lado</span><span>Tamaño</span><span>Entrada</span><span>Liquidación</span><span>Margen</span><span></span></div>'+
        ps.map(p=>`<div class="pos-row">
          <span><span class="side ${p.lado}">${p.lado==='long'?'LONG':'SHORT'} ${p.lev}×</span></span>
          <span>${fmt(p.margen*p.lev)} USDT</span>
          <span>$${fmt(p.precio)}</span>
          <span>$${fmt(liqDe(p.precio,p.lev,p.lado==='long'))}</span>
          <span>${fmt(p.margen)} USDT</span>
          <button class="close" data-id="${p.id}">Cerrar</button>
        </div>`).join('');
      c.querySelectorAll('.close').forEach(b=>b.onclick=()=>{ cerrarPosicion(+b.dataset.id); pintarLista(); });
    }

    // Precio en vivo + cambio 24h.
    async function tick(){
      try{
        const r=await fetch('https://api.binance.com/api/v3/ticker/24hr?symbol='+sim);
        if(r.ok){ const j=await r.json(); precio=+j.lastPrice; chg=+j.priceChangePercent;
          $('f-price').textContent='$'+fmt(precio);
          const ce=$('f-chg'); ce.textContent=(chg>=0?'+':'')+chg.toFixed(2)+'%'; ce.className=chg>=0?'up':'down';
        }
      }catch(_){}
      refrescar(); pintarLista();
    }
    tick(); setInterval(tick, 3000);

    try{ arrancarIdioma(); }catch(e){}
  </script>
</body>
</html>
