<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Trading Demo interface preview">
  <defs>
    <linearGradient id="tdbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121926"/><stop offset="1" stop-color="#0a0d12"/>
    </linearGradient>
    <linearGradient id="tdup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2ee86a" stop-opacity=".9"/><stop offset="1" stop-color="#2ee86a" stop-opacity=".05"/>
    </linearGradient>
  </defs>
  <rect width="480" height="270" fill="url(#tdbg)"/>
  <!-- grid -->
  <g stroke="#1b232e" stroke-width="1">
    <line x1="0" y1="70" x2="330" y2="70"/><line x1="0" y1="120" x2="330" y2="120"/>
    <line x1="0" y1="170" x2="330" y2="170"/><line x1="0" y1="220" x2="330" y2="220"/>
  </g>
  <!-- top bar -->
  <rect x="0" y="0" width="480" height="26" fill="#10151c"/>
  <circle cx="16" cy="13" r="4" fill="#E8B84B"/>
  <text x="28" y="17" font-family="'Chakra Petch',monospace" font-size="11" font-weight="800" letter-spacing="1.3" fill="#E8B84B">TRADING DEMO</text>
  <rect x="150" y="6" width="42" height="15" rx="7" fill="rgba(46,232,106,.16)" stroke="rgba(46,232,106,.5)"/>
  <text x="171" y="16" text-anchor="middle" font-family="'Chakra Petch',monospace" font-size="8.5" font-weight="800" letter-spacing="1" fill="#3ee88a">FREE</text>
  <text x="252" y="17" font-family="monospace" font-size="10" font-weight="700" fill="#eaecef">BTCUSDT</text>
  <text x="330" y="17" font-family="monospace" font-size="10" font-weight="700" fill="#3ee88a">+1.84%</text>
  <!-- candles -->
  <g stroke-width="5">
    <line x1="24" y1="150" x2="24" y2="200" stroke="#ff5b6e"/><line x1="48" y1="140" x2="48" y2="185" stroke="#ff5b6e"/>
    <line x1="72" y1="120" x2="72" y2="175" stroke="#2ee86a"/><line x1="96" y1="110" x2="96" y2="150" stroke="#2ee86a"/>
    <line x1="120" y1="130" x2="120" y2="160" stroke="#ff5b6e"/><line x1="144" y1="105" x2="144" y2="140" stroke="#2ee86a"/>
    <line x1="168" y1="85" x2="168" y2="125" stroke="#2ee86a"/><line x1="192" y1="95" x2="192" y2="130" stroke="#ff5b6e"/>
    <line x1="216" y1="70" x2="216" y2="110" stroke="#2ee86a"/><line x1="240" y1="60" x2="240" y2="100" stroke="#2ee86a"/>
    <line x1="264" y1="80" x2="264" y2="120" stroke="#ff5b6e"/><line x1="288" y1="64" x2="288" y2="104" stroke="#2ee86a"/>
  </g>
  <!-- entry line (marked trade) -->
  <line x1="0" y1="96" x2="330" y2="96" stroke="#E8B84B" stroke-width="1.2" stroke-dasharray="5 4"/>
  <rect x="286" y="88" width="44" height="16" rx="3" fill="#E8B84B"/>
  <text x="308" y="99" text-anchor="middle" font-family="monospace" font-size="9" font-weight="800" fill="#2a1d00">LONG</text>
  <!-- order book column -->
  <rect x="342" y="34" width="138" height="150" fill="#0c111a"/>
  <g font-family="monospace" font-size="8" fill="#ff8a95">
    <rect x="342" y="40" width="138" height="12" fill="rgba(255,91,110,.10)"/><text x="350" y="49">67,420.5</text>
    <rect x="372" y="54" width="108" height="12" fill="rgba(255,91,110,.14)"/><text x="350" y="63">67,410.0</text>
    <rect x="392" y="68" width="88" height="12" fill="rgba(255,91,110,.18)"/><text x="350" y="77">67,402.1</text>
  </g>
  <text x="350" y="98" font-family="'Chakra Petch',monospace" font-size="12" font-weight="800" fill="#3ee88a">67,398</text>
  <g font-family="monospace" font-size="8" fill="#6ee7a8">
    <rect x="392" y="104" width="88" height="12" fill="rgba(46,232,106,.18)"/><text x="350" y="113">67,390.2</text>
    <rect x="372" y="118" width="108" height="12" fill="rgba(46,232,106,.14)"/><text x="350" y="127">67,382.6</text>
    <rect x="342" y="132" width="138" height="12" fill="rgba(46,232,106,.10)"/><text x="350" y="141">67,375.0</text>
  </g>
  <!-- long / short buttons -->
  <rect x="24" y="226" width="140" height="28" rx="6" fill="#1fc96e"/>
  <text x="94" y="244" text-anchor="middle" font-family="'Chakra Petch',monospace" font-size="12" font-weight="800" fill="#04210f">BUY / LONG</text>
  <rect x="176" y="226" width="140" height="28" rx="6" fill="#e03546"/>
  <text x="246" y="244" text-anchor="middle" font-family="'Chakra Petch',monospace" font-size="12" font-weight="800" fill="#2a0509">SELL / SHORT</text>
  <!-- leverage chip -->
  <rect x="342" y="192" width="60" height="22" rx="5" fill="rgba(232,184,75,.14)" stroke="rgba(232,184,75,.45)"/>
  <text x="372" y="207" text-anchor="middle" font-family="monospace" font-size="10" font-weight="800" fill="#E8B84B">20x</text>
  <rect x="408" y="192" width="72" height="22" rx="5" fill="rgba(255,255,255,.05)" stroke="#2a333f"/>
  <text x="444" y="207" text-anchor="middle" font-family="monospace" font-size="9" font-weight="700" fill="#b7bdc6">DEMO $</text>
</svg>
