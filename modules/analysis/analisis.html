<!-- ══════════════════════════════════════════════════════════════════════
     PAGINA PROPIA DE ANALISIS.
     Antes esta seccion se montaba como overlay sobre app.html, que es la
     pagina de los Bots. Por eso al entrar se veian los Bots y su aviso un
     instante, y al pulsar Back se volvia a los Bots. Aqui no hay nada de los
     Bots debajo: la seccion arranca sola, igual que ya hace Wallet Shield.
     El arranque (wallet + ethers + estilo base) es el MISMO que usa la
     portada para abrir Analisis, asi que el control de acceso de pago
     funciona exactamente igual.
     ══════════════════════════════════════════════════════════════════════ -->
<style>
  :root{
    --gold:#E8B84B; --gold-soft:#C9A84B; --gold-md:#cf9f2e; --gold-hi:#f4d089; --gold-lo:rgba(232,184,75,.5);
    --ink:#eaecef; --ink2:#a9b2bd; --ink3:#7d8794; --ink4:#4a5561;
    --line:#1a2029; --line2:#232b36; --surf:#10151c;
    --sans:'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --display:'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --mono:'IBM Plex Mono', ui-monospace, Consolas, monospace;
  }
  html,body{margin:0;padding:0;background:#05070a;color:#eaecef;font-family:var(--display);min-height:100%;-webkit-text-size-adjust:100%}
  body{overscroll-behavior:none}
  *{box-sizing:border-box}
  ::-webkit-scrollbar{width:0!important;height:0!important;display:none!important;background:transparent!important}
  html,body{scrollbar-width:none!important;-ms-overflow-style:none!important}
  /* Mientras carga el modulo, fondo limpio: nada de otra seccion asomando. */
  #cargando{position:fixed;inset:0;display:grid;place-items:center;background:#05070a;z-index:10}
  #cargando .sp{width:34px;height:34px;border-radius:50%;border:3px solid rgba(232,184,75,.2);border-top-color:#E8B84B;animation:g .7s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="cargando"><div class="sp"></div></div>

<script type="module">
  /* Marca de pagina propia: el boton Back de Analisis la lee para SALIR de
     verdad (history.back) en vez de solo cerrar el overlay y dejar ver lo de
     debajo. */
  window.__ANALISIS_PAGINA__ = true;

  const J = new URL('../../assets/js/', document.baseURI).href;
  (async () => {
    let W = null, ethers = null;
    try { W = await import(J + 'wallet.js?v=129'); } catch (_) {}
    try { if (W && W.reconectarSiProcede) await W.reconectarSiProcede(); } catch (_) {}
    try { ethers = await import(J + 'vendor/ethers-6.13.4.min.js?v=126'); } catch (_) {}
    // Estilo base (variables de color y contexto para los modales de wallet/cobro).
    try {
      const [est, util] = await Promise.all([
        import(J + 'gridbot/estilos.js?v=201'),
        import(J + 'gridbot/util.js?v=1')
      ]);
      est.inyectarEstilo(util.tipoNum);
      if (!document.getElementById('cco-scope')) {
        const sc = document.createElement('div'); sc.id = 'cco-scope'; sc.className = 'colmena-app-scope';
        document.body.appendChild(sc);
      }
    } catch (_) {}
    // La seccion. abrirAnalisis revisa el acceso de pago igual que desde la portada.
    try {
      const m = await import('./analisis.js?v=12');
      await m.abrirAnalisis('hero', W, ethers);
    } catch (e) {
      console.warn('analisis:', e);
      document.body.insertAdjacentHTML('beforeend',
        '<div style="position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:#a7b0bb;font-family:var(--display)">No se pudo cargar esta seccion. Recarga la pagina.</div>');
    }
    const c = document.getElementById('cargando');
    if (c) { c.style.transition = 'opacity .25s'; c.style.opacity = '0'; setTimeout(() => c.remove(), 260); }
  })();
</script>

<script>
  /* Service worker, igual que el resto del sitio. */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('../../sw3.js').catch(function () {}); });
  }
</script>

</body>
