<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="400" height="260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1420"/><stop offset="1" stop-color="#070b10"/>
    </linearGradient>
    <linearGradient id="rz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,74,90,.28)"/><stop offset="1" stop-color="rgba(255,74,90,.05)"/>
    </linearGradient>
    <linearGradient id="gz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(40,210,100,.05)"/><stop offset="1" stop-color="rgba(40,210,100,.28)"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bg)"/>
  <!-- zona de resistencia (roja = short) -->
  <rect x="0" y="40" width="400" height="26" fill="url(#rz)"/>
  <line x1="0" y1="53" x2="400" y2="53" stroke="#ff4a5a" stroke-width="2" opacity=".75"/>
  <!-- zona de soporte (verde = long) -->
  <rect x="0" y="196" width="400" height="26" fill="url(#gz)"/>
  <line x1="0" y1="209" x2="400" y2="209" stroke="#28d26a" stroke-width="2" opacity=".75"/>
  <!-- velas -->
  <g stroke-linecap="round">
    <g stroke="#26d46a" fill="#26d46a">
      <line x1="40" y1="120" x2="40" y2="150" stroke-width="1.5"/><rect x="36" y="128" width="8" height="18"/>
      <line x1="70" y1="100" x2="70" y2="140" stroke-width="1.5"/><rect x="66" y="108" width="8" height="26"/>
      <line x1="100" y1="70" x2="100" y2="120" stroke-width="1.5"/><rect x="96" y="80" width="8" height="34"/>
      <line x1="250" y1="150" x2="250" y2="185" stroke-width="1.5"/><rect x="246" y="158" width="8" height="22"/>
      <line x1="310" y1="175" x2="310" y2="205" stroke-width="1.5"/><rect x="306" y="183" width="8" height="18"/>
    </g>
    <g stroke="#ff5162" fill="#ff5162">
      <line x1="130" y1="60" x2="130" y2="105" stroke-width="1.5"/><rect x="126" y="66" width="8" height="30"/>
      <line x1="160" y1="80" x2="160" y2="130" stroke-width="1.5"/><rect x="156" y="88" width="8" height="34"/>
      <line x1="190" y1="110" x2="190" y2="160" stroke-width="1.5"/><rect x="186" y="118" width="8" height="36"/>
      <line x1="220" y1="140" x2="220" y2="180" stroke-width="1.5"/><rect x="216" y="148" width="8" height="26"/>
      <line x1="280" y1="165" x2="280" y2="200" stroke-width="1.5"/><rect x="276" y="172" width="8" height="22"/>
    </g>
  </g>
  <!-- marcadores que "titilan" -->
  <g>
    <circle cx="110" cy="53" r="12" fill="rgba(255,74,90,.22)"/><circle cx="110" cy="53" r="8" fill="none" stroke="#ff4a5a" stroke-width="2"/><circle cx="110" cy="53" r="3" fill="#E8B84B"/>
    <path d="M250 41 l9 12 l-9 12 l-9 -12 z" fill="rgba(255,74,90,.2)" stroke="#ff4a5a" stroke-width="1.6"/>
    <circle cx="300" cy="209" r="12" fill="rgba(40,210,100,.22)"/><circle cx="300" cy="209" r="8" fill="none" stroke="#28d26a" stroke-width="2"/><circle cx="300" cy="209" r="3" fill="#E8B84B"/>
    <path d="M150 197 l9 12 l-9 12 l-9 -12 z" fill="rgba(40,210,100,.2)" stroke="#28d26a" stroke-width="1.6"/>
  </g>
</svg>
