<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Institutional Analysis terminal preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121926"/><stop offset="1" stop-color="#0a0d12"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8B84B" stop-opacity="0"/><stop offset="1" stop-color="#E8B84B" stop-opacity=".5"/>
    </linearGradient>
  </defs>
  <rect width="480" height="270" fill="url(#bg)"/>
  <!-- grid -->
  <g stroke="#1b232e" stroke-width="1">
    <line x1="0" y1="60" x2="480" y2="60"/><line x1="0" y1="110" x2="480" y2="110"/>
    <line x1="0" y1="160" x2="480" y2="160"/><line x1="0" y1="210" x2="480" y2="210"/>
    <line x1="90" y1="34" x2="90" y2="248"/><line x1="180" y1="34" x2="180" y2="248"/><line x1="270" y1="34" x2="270" y2="248"/>
  </g>
  <!-- top bar -->
  <rect x="0" y="0" width="480" height="26" fill="#10151c"/>
  <circle cx="16" cy="13" r="4" fill="#E8B84B"/>
  <text x="28" y="17" font-family="'Chakra Petch',monospace" font-size="11" font-weight="800" letter-spacing="1.5" fill="#E8B84B">INSTITUTIONAL</text>
  <text x="168" y="17" font-family="'Chakra Petch',monospace" font-size="9" letter-spacing="1.5" fill="#6b7580">ANALYSIS DESK</text>
  <rect x="300" y="6" width="104" height="14" rx="4" fill="#0a0d12" stroke="#2a333f"/>
  <text x="400" y="17" text-anchor="end" font-family="'Chakra Petch',monospace" font-size="10" font-weight="800" fill="#2ee86a">+1.90%</text>
  <!-- candlesticks (left ~2/3) -->
  <g stroke-linecap="butt">
    <!-- up=green #2ee86a, down=red #ff5b6e -->
    <g stroke="#2ee86a" fill="#2ee86a">
      <line x1="30" y1="150" x2="30" y2="196" stroke-width="2"/><rect x="26" y="160" width="8" height="28"/>
      <line x1="54" y1="138" x2="54" y2="182" stroke-width="2"/><rect x="50" y="146" width="8" height="26"/>
      <line x1="126" y1="150" x2="126" y2="196" stroke-width="2"/><rect x="122" y="162" width="8" height="26"/>
      <line x1="150" y1="130" x2="150" y2="172" stroke-width="2"/><rect x="146" y="140" width="8" height="24"/>
      <line x1="174" y1="110" x2="174" y2="150" stroke-width="2"/><rect x="170" y="120" width="8" height="24"/>
      <line x1="222" y1="124" x2="222" y2="168" stroke-width="2"/><rect x="218" y="136" width="8" height="26"/>
      <line x1="246" y1="104" x2="246" y2="146" stroke-width="2"/><rect x="242" y="112" width="8" height="26"/>
    </g>
    <g stroke="#ff5b6e" fill="#ff5b6e">
      <line x1="78" y1="128" x2="78" y2="176" stroke-width="2"/><rect x="74" y="138" width="8" height="26"/>
      <line x1="102" y1="140" x2="102" y2="190" stroke-width="2"/><rect x="98" y="150" width="8" height="30"/>
      <line x1="198" y1="104" x2="198" y2="150" stroke-width="2"/><rect x="194" y="116" width="8" height="26"/>
      <line x1="270" y1="96" x2="270" y2="140" stroke-width="2"/><rect x="266" y="104" width="8" height="26"/>
      <line x1="294" y1="108" x2="294" y2="156" stroke-width="2"/><rect x="290" y="120" width="8" height="28"/>
    </g>
  </g>
  <!-- SMA gold line -->
  <polyline fill="none" stroke="#E8B84B" stroke-width="2" stroke-linejoin="round" opacity=".92"
    points="26,178 50,164 74,152 98,160 122,172 146,152 170,134 194,128 218,142 242,122 266,116 290,132"/>
  <!-- volume strip -->
  <g>
    <rect x="26" y="232" width="7" height="10" fill="#2ee86a" opacity=".4"/><rect x="50" y="226" width="7" height="16" fill="#2ee86a" opacity=".4"/>
    <rect x="74" y="230" width="7" height="12" fill="#ff5b6e" opacity=".4"/><rect x="98" y="222" width="7" height="20" fill="#ff5b6e" opacity=".4"/>
    <rect x="122" y="228" width="7" height="14" fill="#2ee86a" opacity=".4"/><rect x="146" y="224" width="7" height="18" fill="#2ee86a" opacity=".4"/>
    <rect x="170" y="218" width="7" height="24" fill="#2ee86a" opacity=".4"/><rect x="194" y="226" width="7" height="16" fill="#ff5b6e" opacity=".4"/>
    <rect x="218" y="230" width="7" height="12" fill="#2ee86a" opacity=".4"/><rect x="242" y="220" width="7" height="22" fill="#2ee86a" opacity=".4"/>
    <rect x="266" y="224" width="7" height="18" fill="#ff5b6e" opacity=".4"/><rect x="290" y="228" width="7" height="14" fill="#ff5b6e" opacity=".4"/>
  </g>
  <!-- right quote/panels -->
  <rect x="326" y="34" width="146" height="214" rx="8" fill="#0d121a" stroke="#1f2733"/>
  <text x="340" y="52" font-family="'Chakra Petch',monospace" font-size="9" letter-spacing="1" fill="#E8B84B">QUOTE · BTC</text>
  <text x="340" y="82" font-family="'Chakra Petch',monospace" font-size="24" font-weight="800" fill="#eef2f6">68,102</text>
  <text x="340" y="100" font-family="'Chakra Petch',monospace" font-size="11" font-weight="700" fill="#2ee86a">+1,284 · +1.92%</text>
  <g font-family="'Chakra Petch',monospace" font-size="9">
    <line x1="340" y1="116" x2="458" y2="116" stroke="#1b232e"/>
    <text x="340" y="134" fill="#6b7580">OPEN</text><text x="458" y="134" text-anchor="end" fill="#cdd4dc">66,818</text>
    <text x="340" y="154" fill="#6b7580">24H HIGH</text><text x="458" y="154" text-anchor="end" fill="#cdd4dc">68,540</text>
    <text x="340" y="174" fill="#6b7580">24H LOW</text><text x="458" y="174" text-anchor="end" fill="#cdd4dc">65,990</text>
    <line x1="340" y1="186" x2="458" y2="186" stroke="#1b232e"/>
    <text x="340" y="204" fill="#6b7580">BTC DOM</text><text x="458" y="204" text-anchor="end" fill="#E8B84B">54.2%</text>
    <text x="340" y="224" fill="#6b7580">F&amp;G</text><text x="458" y="224" text-anchor="end" fill="#2ee86a">62 · GREED</text>
  </g>
  <rect x="0" y="0" width="480" height="3" fill="url(#glow)"/>
</svg>
