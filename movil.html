<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0e12">
<title>Cripto Cuba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet" href="assets/css/asistente.css?v=125">
<style>
  /* La hoja base del sitio trae el tema claro original. Aquí se redefinen sus
     colores a la paleta oscura y dorada, igual que hace la página principal. */
  :root{
    --panel:#10141a !important; --panel-2:#0a0e13 !important;
    --bg:#05070a !important;    --bg-2:#0a0e13 !important;
    --line:#232b36 !important;  --line-soft:#1a202a !important;
    --neon:#E8B84B !important;  --neon-lit:#f4d089 !important; --neon-dim:#c79426 !important;
    --txt:#eaecef !important;   --txt-soft:#a7b0bb !important;
  }
  html, body { background:#0b0e12 !important; color:#eaecef !important; }
</style>

<link rel="manifest" href="manifest-aurex.webmanifest">

<!-- Página propia de la experiencia móvil.
     Antes el móvil se montaba encima de app.html, que es la página de los bots,
     y por eso se veían los bots un instante al entrar. Aquí no hay nada más. -->

<style>
  :root{
    --gold:#E8B84B; --gold-soft:#C9A84B; --gold-md:#cf9f2e;
    --display:'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --mono:'IBM Plex Mono', ui-monospace, Consolas, monospace;
  }
  html,body{margin:0;padding:0;background:#0B0E11;color:#eaecef;font-family:var(--display);
    height:100%;overscroll-behavior:none;-webkit-text-size-adjust:100%}
  *{box-sizing:border-box}

  /* ── Barra de desplazamiento oculta (igual que en el resto del sitio) ──
     Sin esto el navegador dibuja su barra blanca con flechas, que no encaja
     con el diseño oscuro. */
  ::-webkit-scrollbar{width:0!important;height:0!important;display:none!important;background:transparent!important}
  ::-webkit-scrollbar-track{background:transparent!important}
  ::-webkit-scrollbar-thumb{background:transparent!important}
  ::-webkit-scrollbar-button{display:none!important;width:0!important;height:0!important}
  ::-webkit-scrollbar-corner{background:transparent!important}
  html,body{scrollbar-width:none!important;-ms-overflow-style:none!important}

  #arranque{position:fixed;inset:0;display:grid;place-items:center;background:#0B0E11;z-index:50}
  #arranque .sp{width:32px;height:32px;border-radius:50%;
    border:3px solid rgba(232,184,75,.2);border-top-color:#E8B84B;animation:g .7s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
</style>
<script src="assets/js/mv-adaptar.js?v=7"></script>
</head>
<body>

<div id="arranque"><div class="sp"></div></div>
<!-- Contenedor donde viven los bots y el swap. Oculto por defecto; se muestra
     solo cuando el usuario abre bots o swap. Sin él, esas secciones no abren. -->
<div id="colmena-app" style="opacity:0;pointer-events:none;position:fixed;inset:0;z-index:-1"></div>
<style>
  html.ver-web #colmena-app, body.mv-bots #colmena-app{
    opacity:1!important;pointer-events:auto!important;z-index:9500!important}
</style>

<script type="module">
  import * as wallet from './assets/js/wallet.js?v=126';

  /* Conexión de wallet con reintento. En los navegadores internos de las
     wallets el proveedor a veces tarda en aparecer; si se comprueba justo en el
     instante del toque, parece que el botón no hace nada. Aquí esperamos a que
     aparezca antes de rendirnos. */
  async function esperarProveedor(ms) {
    const hasta = Date.now() + (ms || 2500);
    while (Date.now() < hasta) {
      if (window.ethereum) return true;
      await new Promise(r => setTimeout(r, 120));
    }
    return !!window.ethereum;
  }

  async function conectarWallet() {
    try {
      await esperarProveedor(2500);
      await wallet.conectar();
    } catch (e) {
      const msg = String((e && e.message) || e || '');
      if (/rejected|denied|user/i.test(msg)) return;   // lo canceló el usuario
      alert('No se pudo conectar la wallet. Ábrela, desbloquéala e inténtalo de nuevo.');
    }
  }

  (async () => {
    try { await wallet.reconectarSiProcede(); } catch (_) {}
    try {
      const m = await import('./assets/js/movil/movil.js?v=30');
      await m.montarMovil({ conectarWallet });
      // cargar el motor de bots y swap (sin él, esas secciones no abren)
      try { await import('./assets/js/gridbot-ui.js?v=220'); } catch (_) {}
      try {
        const idi = await import('./assets/js/idioma.js?v=163');
        idi.forzarInglesPorDefecto && idi.forzarInglesPorDefecto();
        idi.arrancarIdioma && idi.arrancarIdioma();
      } catch (_) {}
    } catch (e) {
      console.warn('movil:', e);
      document.body.insertAdjacentHTML('beforeend',
        '<div style="position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:#8b96a3">' +
        'No se pudo cargar. Recarga la página.</div>');
    }
    const a = document.getElementById('arranque');
    if (a) { a.style.transition = 'opacity .25s'; a.style.opacity = '0'; setTimeout(() => a.remove(), 280); }
  })();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>


</body>
</html>
